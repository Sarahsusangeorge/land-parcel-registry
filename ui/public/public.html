<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Public view | Land Parcel Registry</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin
  onerror="this.onerror=null;this.removeAttribute('integrity');this.removeAttribute('crossorigin');this.href='/vendor/leaflet/leaflet.css'">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; font-size: 14px;
         background: #f5f5f5; color: #222; height: 100vh; display: flex;
         flex-direction: column; }
  header { background: #37474f; color: #fff; padding: 10px 16px;
           display: flex; align-items: baseline; gap: 12px; flex-shrink: 0; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .label { font-size: 12px; opacity: .75; }
  .layout { display: flex; flex: 1; min-height: 0; overflow: hidden; }
  .map-wrap { flex: 1; min-width: 0; position: relative; min-height: 320px; }
  #map { position: absolute; top: 0; right: 0; bottom: 0; left: 0; height: 100%;
         min-height: 320px; background: #dde3e8; }
  .map-error { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex;
               align-items: center; justify-content: center; padding: 24px;
               text-align: center; color: #c62828; background: #fff; z-index: 500; }
  .panel { width: 380px; flex-shrink: 0; display: flex; flex-direction: column;
           background: #fff; border-left: 1px solid #ddd; overflow: hidden; }
  .chain-info { padding: 10px 14px; border-bottom: 1px solid #eee; flex-shrink: 0; }
  .chain-row { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
  .chain-label { color: #888; font-size: 12px; min-width: 100px; }
  .chain-val { font-family: monospace; font-size: 12px; color: #222;
               word-break: break-all; }
  .refresh-note { font-size: 11px; color: #aaa; padding: 4px 14px 6px;
                  border-bottom: 1px solid #eee; flex-shrink: 0; }
  .token-table-wrap { flex: 1; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th { position: sticky; top: 0; background: #fafafa;
             border-bottom: 2px solid #eee; padding: 7px 8px;
             text-align: left; color: #555; font-weight: 600; }
  tbody td { padding: 6px 8px; border-bottom: 1px solid #f0f0f0;
             vertical-align: top; }
  tbody tr:hover { background: #fafafa; }
  .cell-chips { display: flex; flex-wrap: wrap; gap: 3px; }
  .cell-chip { background: #e3f2fd; color: #1565c0; border-radius: 3px;
               padding: 1px 5px; font-family: monospace; font-size: 11px; }
  .mono { font-family: monospace; }
  #chain-status { word-break: normal; font-family: inherit; font-size: 12px; }
  .commitment-cell { cursor: help; }
  .no-data { padding: 20px 14px; color: #aaa; font-size: 13px; }
  .error-msg { padding: 10px 14px; color: #c62828; font-size: 13px; }
  .status-dot { display: inline-block; width: 8px; height: 8px;
                border-radius: 50%; margin-right: 6px; }
  .dot-ok  { background: #43a047; }
  .dot-err { background: #ef5350; }
  .map-legend { background:rgba(255,255,255,.92);padding:7px 10px;border-radius:4px;
    box-shadow:0 1px 4px rgba(0,0,0,.2);font-size:11px;line-height:1; }
  .map-legend .legend-title { font-weight:600;color:#444;margin-bottom:5px;font-size:11px; }
  .legend-item { display:flex;align-items:center;gap:5px;padding:2px 0; }
  .legend-swatch { display:inline-block;width:16px;height:10px;border-radius:2px;flex-shrink:0; }
  .ls-coarse { background:rgba(25,118,210,.2);border:1px solid #0d47a1; }
  .leaflet-tooltip.token-label-tt { background:rgba(255,255,255,.88) !important;
    border:1px solid #9e9e9e !important;border-radius:3px !important;
    padding:2px 5px !important;font-size:11px !important;font-weight:600 !important;
    box-shadow:none !important;color:#333 !important;
    pointer-events:none !important;white-space:nowrap !important; }
  .leaflet-tooltip-center.token-label-tt::before,
  .leaflet-tooltip.token-label-tt::before { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Public view</h1>
  <span class="label">Only coarse cells are on the chain. Exact boundaries are not.</span>
</header>
<div class="layout">
  <div class="map-wrap"><div id="map"></div></div>
  <div class="panel">
    <div class="chain-info" id="chain-info">
      <div class="chain-row">
        <span class="chain-label">Status</span>
        <span class="chain-val" id="chain-status">not connected</span>
      </div>
      <div class="chain-row">
        <span class="chain-label">Occupied root</span>
        <span class="chain-val mono" id="chain-root" title="">none yet</span>
      </div>
      <div class="chain-row">
        <span class="chain-label">Tokens minted</span>
        <span class="chain-val" id="chain-count">0</span>
      </div>
    </div>
    <div class="refresh-note" id="refresh-note">Auto-refreshes every 3 s</div>
    <div class="token-table-wrap">
      <div id="token-area"><div class="no-data">No tokens yet. Register a parcel first.</div></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN2GqnE=" crossorigin></script>
<script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
<script>
// If the CDN is blocked or slow, use the same pinned versions served locally.
if (typeof L === "undefined") document.write('<script src="/vendor/leaflet/leaflet.js"><\/script>');
if (typeof h3 === "undefined") document.write('<script src="/vendor/h3-js/h3-js.umd.js"><\/script>');
</script>
<script>
"use strict";
// ── map setup ─────────────────────────────────────────────────────────────────
if (typeof L === "undefined" || typeof h3 === "undefined") {
  const box = document.createElement("div");
  box.className = "map-error";
  box.textContent = "The map libraries did not load. Check the internet connection and reload.";
  document.querySelector(".map-wrap").appendChild(box);
  throw new Error("Leaflet or h3-js failed to load");
}
const map = L.map("map").setView([42.332, -71.207], 14);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

// Tell Leaflet when its box changes size (side-by-side panels, iframe, resize).
function refreshMapSize() { map.invalidateSize(); }
window.addEventListener("resize", refreshMapSize);
window.addEventListener("load", function () {
  refreshMapSize();
  setTimeout(refreshMapSize, 300);
});
if (typeof ResizeObserver !== "undefined") {
  new ResizeObserver(refreshMapSize).observe(document.querySelector(".map-wrap"));
}

// ── legend ────────────────────────────────────────────────────────────────────
(function () {
  const ctrl = L.control({ position: "bottomleft" });
  ctrl.onAdd = function () {
    const div = L.DomUtil.create("div", "map-legend");
    div.innerHTML =
      '<div class="legend-title">Legend</div>' +
      '<div class="legend-item"><span class="legend-swatch ls-coarse"></span>Coarse cell (res 9)</div>';
    return div;
  };
  ctrl.addTo(map);
}());

// ── state ─────────────────────────────────────────────────────────────────────
let currentTokens = [];
let coarseLayers  = {};   // tokenId → array of Leaflet layers
let fitDone       = false;

const COARSE_STYLE = {
  color: "#0d47a1", weight: 1,
  fillColor: "#1976d2", fillOpacity: 0.4
};

// Token colours cycle through a palette so each parcel has a distinct shade.
const PALETTE = [
  "#1976d2", "#388e3c", "#7b1fa2", "#0097a7",
  "#f57c00", "#c62828", "#00695c", "#5e35b1"
];

function tokenStyle(index) {
  const c = PALETTE[index % PALETTE.length];
  return { color: c, weight: 1, fillColor: c, fillOpacity: 0.35 };
}

// ── utilities ─────────────────────────────────────────────────────────────────
// Convert a decimal H3 cell ID string to its 15-character hex form for h3-js.
function decToH3(dec) {
  return BigInt(dec).toString(16);
}

function shortStr(s, n) {
  n = n || 12;
  if (s.length <= n * 2) return s;
  return s.slice(0, n) + "…" + s.slice(-6);
}

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) Object.assign(e, attrs);
  if (children) {
    for (const c of children) {
      if (typeof c === "string") e.appendChild(document.createTextNode(c));
      else if (c) e.appendChild(c);
    }
  }
  return e;
}

// ── draw coarse cells on map ──────────────────────────────────────────────────
function drawCoarseCells(tokens) {
  // Remove all existing coarse layers.
  for (const id of Object.keys(coarseLayers)) {
    for (const l of coarseLayers[id]) map.removeLayer(l);
  }
  coarseLayers = {};

  const allPoints = [];

  for (let i = 0; i < tokens.length; i++) {
    const token = tokens[i];
    const style = tokenStyle(i);
    coarseLayers[token.tokenId] = [];

    for (const cellDec of token.coarseCells) {
      let cellHex;
      try { cellHex = decToH3(cellDec); } catch { continue; }
      let boundary;
      try { boundary = h3.cellToBoundary(cellHex); } catch { continue; }
      const poly = L.polygon(boundary, style).addTo(map);
      poly.bindTooltip(
        "Token #" + token.tokenId + ": coarse cell " + cellHex +
        "\nOwner: " + token.owner,
        { sticky: true }
      );
      coarseLayers[token.tokenId].push(poly);
      allPoints.push(...boundary);
    }
  }

  if (!fitDone && allPoints.length) {
    const latlngs = allPoints.map(function (c) { return L.latLng(c[0], c[1]); });
    const bounds = L.latLngBounds(latlngs);
    if (bounds.isValid()) {
      map.invalidateSize();
      map.fitBounds(bounds, { padding: [20, 20] });
      fitDone = true;
    }
  }
}

// ── build token table ─────────────────────────────────────────────────────────
function buildTable(tokens) {
  const area = document.getElementById("token-area");
  if (!tokens.length) {
    area.innerHTML = '<div class="no-data">No tokens yet. Register a parcel first.</div>';
    return;
  }

  const tbl = el("table");
  const thead = el("thead");
  const hrow  = el("tr");
  for (const h of ["#", "Owner", "Commitment", "Coarse cells"]) {
    hrow.appendChild(el("th", {}, [h]));
  }
  thead.appendChild(hrow);
  tbl.appendChild(thead);

  const tbody = el("tbody");
  for (const t of tokens) {
    const tr = el("tr");

    // Token ID
    tr.appendChild(el("td", { className: "mono" }, [String(t.tokenId)]));

    // Owner (shortened, full on hover)
    const ownerTd = el("td");
    const ownerSpan = el("span", {
      className: "mono commitment-cell",
      title: t.owner
    }, [shortStr(t.owner, 8)]);
    ownerTd.appendChild(ownerSpan);
    tr.appendChild(ownerTd);

    // Commitment (shortened, full value on hover)
    const cmtTd = el("td");
    const cmtSpan = el("span", {
      className: "mono commitment-cell",
      title: "Full commitment: " + t.commitment
    }, [shortStr(t.commitment, 8)]);
    cmtTd.appendChild(cmtSpan);
    tr.appendChild(cmtTd);

    // Coarse cells
    const cellTd  = el("td");
    const chips   = el("div", { className: "cell-chips" });
    for (const c of t.coarseCells) {
      let hex;
      try { hex = decToH3(c); } catch { hex = c; }
      chips.appendChild(el("span", { className: "cell-chip", title: "Decimal: " + c }, [hex]));
    }
    cellTd.appendChild(chips);
    tr.appendChild(cellTd);

    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody);

  area.innerHTML = "";
  area.appendChild(tbl);
}

// ── fetch chain state and refresh UI ─────────────────────────────────────────
async function refresh() {
  let data;
  try {
    const resp = await fetch("/api/chain");
    data = await resp.json();
  } catch (e) {
    setStatus(false, "Network error: " + e.message);
    return;
  }

  if (data.error || data.connected === false) {
    setStatus(false, data.error || data.message);
    document.getElementById("chain-root").textContent = "none yet";
    document.getElementById("chain-count").textContent = "0";
    currentTokens = [];
    buildTable([]);
    drawCoarseCells([]);
    return;
  }

  setStatus(true, "Connected");
  document.getElementById("chain-root").textContent =
    data.occupiedRoot === "0" ? "0 (empty tree)" : shortStr(data.occupiedRoot, 14);
  document.getElementById("chain-root").title = data.occupiedRoot;
  document.getElementById("chain-count").textContent = data.tokenCount;

  // Only redraw if the token count changed.
  if (data.tokenCount !== currentTokens.length) {
    currentTokens = data.tokens;
    drawCoarseCells(currentTokens);
    buildTable(currentTokens);
  }

  document.getElementById("refresh-note").textContent =
    "Last updated: " + new Date().toLocaleTimeString() + " · auto-refreshes every 3 s";
}

function setStatus(ok, msg) {
  const el = document.getElementById("chain-status");
  el.innerHTML = '<span class="status-dot ' + (ok ? "dot-ok" : "dot-err") + '"></span>' + msg;
}

// ── poll every 3 s ────────────────────────────────────────────────────────────
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
